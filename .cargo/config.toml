[build]
rustflags = []

# MEM-ARM: jemalloc fixes its page size when it is built and aborts on a kernel
# with larger pages. 2^16 = 64 KiB pages run on 4, 16 and 64 KiB ARM64 kernels
# including systems with larger pages. jemalloc-sys reads the target-prefixed name, so
# other targets keep the build host's page size. An existing environment
# variable of the same name takes precedence over these values.
[env]
AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE = "16"
AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE = "16"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

# WebAssembly threading configuration
#
# These flags are required for multi-threading support in WebAssembly:
# 1. Atomic operations for synchronization
# 2. Shared memory between threads
# 3. Thread-local storage (TLS) for per-thread data
#
# Most of these flags were previously emitted by default by the Rust compiler,
# but that was removed in https://github.com/rust-lang/rust/pull/147225
#
# Note that "host" in the descriptions refers to the consumer of the generated
# WebAssembly module. Practically, this means the glue/runtime code which is
# generated by `wasm-bindgen`.
#
# `target-feature=+atomics,+bulk-memory`
#   `atomics`: Enables WebAssembly atomic instructions which are required
#   for thread synchronization (which is required for multithreading).
#   Supported on all browsers we target: https://caniuse.com/wasm-threads
#
#   `bulk-memory`: Enables the bulk memory operations extension, allowing
#   for optimized `mem{move,cpy,set}`, etc. Not required for multithreading,
#   but it's a free performance gain supported by all major browsers we target
#   See https://caniuse.com/wasm-bulk-memory
#   NB: `+bulk-memory` became a default in Rust 1.87, may be OK to remove.
#
# `link-args=--shared-memory`
#   Enables shared memory between threads. This is the foundation for
#   WebAssembly threading.
#
# `link-args=--import-memory`
#   Makes the WASM module import memory from the host instead of creating its
#   own. Required when using shared memory, as the host creates the shared
#   memory and passes it to the module, and also gives us granular control on
#   the JavaScript-/host-side of how much memory we allocate to the web node.
#
# `link-args=--export-memory`
#   Exports the memory so it can be accessed from JavaScript/host code.
#
# `link-args=--max-memory=4294967296`
#   Sets maximum memory to 4GB (4294967296 bytes = 2^32 bytes).
#   This is the maximum addressable memory in 32-bit WebAssembly, and is
#   referenced in `frontend/src/app/core/services/web-node.service.ts`
#
# `link-args=--export=__wasm_init_tls`
# `link-args=--export=__tls_size`
# `link-args=--export=__tls_align`
# `link-args=--export=__tls_base`
#   These are mandatory exports for WebAssembly multi-threading, all
#   needed by the host to initialize memory for thread-local storage.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=+atomics,+bulk-memory",
  "-C",
  "link-args=--shared-memory",
  "-C",
  "link-args=--import-memory",
  "-C",
  "link-args=--export-memory",
  "-C",
  "link-args=--max-memory=4294967296",
  "-C",
  "link-args=--export=__wasm_init_tls",
  "-C",
  "link-args=--export=__tls_size",
  "-C",
  "link-args=--export=__tls_align",
  "-C",
  "link-args=--export=__tls_base",
]

# Cargo aliases for xtask
[alias]
xtask = "run --package xtask --"
x-openapi-gen = "run --package xtask --features xtask/openapi-gen -- openapi"
