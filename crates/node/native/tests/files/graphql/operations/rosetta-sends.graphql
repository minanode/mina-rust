# Mina 4.0.2 src/app/rosetta/lib/construction.ml:25-60 (identical in compatible).
# Only operation names and OCaml ppxCustom annotations changed for validation.
# Payment's token and UInt64 validUntil are stale upstream: OCaml rejects them too.

mutation RosettaSendPayment(
  $from: PublicKey!
  $to_: PublicKey!
  $token: UInt64
  $amount: UInt64!
  $fee: UInt64!
  $validUntil: UInt64
  $memo: String
  $nonce: UInt32!
  $signature: String!
) {
  sendPayment(
    signature: { rawSignature: $signature }
    input: {
      from: $from
      to: $to_
      token: $token
      amount: $amount
      fee: $fee
      validUntil: $validUntil
      memo: $memo
      nonce: $nonce
    }
  ) {
    payment {
      hash
    }
  }
}

mutation RosettaSendDelegation(
  $sender: PublicKey!
  $receiver: PublicKey!
  $fee: UInt64!
  $nonce: UInt32!
  $memo: String
  $signature: String!
) {
  sendDelegation(
    signature: { rawSignature: $signature }
    input: {
      from: $sender
      to: $receiver
      fee: $fee
      memo: $memo
      nonce: $nonce
    }
  ) {
    delegation {
      hash
    }
  }
}
