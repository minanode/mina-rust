# Auro gqlparams.ts at f3d0362d; only operation names changed for the harness.

mutation getStakeTxSendWithRawSignature(
  $fee: UInt64!
  $to: PublicKey!
  $from: PublicKey!
  $nonce: UInt32
  $memo: String
  $validUntil: UInt32
  $rawSignature: String
) {
  sendDelegation(
    input: {
      fee: $fee
      to: $to
      from: $from
      memo: $memo
      nonce: $nonce
      validUntil: $validUntil
    }
    signature: { rawSignature: $rawSignature }
  ) {
    delegation {
      amount
      fee
      feeToken
      from
      hash
      id
      isDelegation
      memo
      nonce
      kind
      to
    }
  }
}

