[package]
name = "mina-node-report"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bug reports for Mina nodes: collection, redaction and the pre-filled issue, shared by `mina report` and the node's HTTP API"

[dependencies]
anyhow = { workspace = true }
backtrace = { workspace = true }
clap = { workspace = true, features = ["env"] }
hex = { workspace = true }
libp2p-identity = { workspace = true, features = ["peerid"] }
mina-core = { workspace = true }
mina-node = { workspace = true }
mina-node-account = { workspace = true }
mina-p2p-messages = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# The bundle's test inputs, for `mina-cli`'s report tests.
test-support = []
