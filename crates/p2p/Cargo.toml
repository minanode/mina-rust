[package]
name = "mina-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
binprot = { workspace = true }
binprot_derive = { workspace = true }
bitflags = { workspace = true, features = ["serde"] }
bs58 = { workspace = true }
bytes = { workspace = true }
cfg-if = { workspace = true }
derive_more = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
multihash = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unsigned-varint = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
x25519-dalek = { workspace = true }

graphannis-malloc_size_of = { workspace = true }
graphannis-malloc_size_of_derive = { workspace = true }

# crypto
blake2 = { workspace = true }
chacha20poly1305 = { workspace = true }
curve25519-dalek = { workspace = true }
hkdf = { workspace = true }
libp2p-identity = { workspace = true, features = ["ed25519", "rand", "serde"] }
multiaddr = { workspace = true }
zeroize = { workspace = true }

mina-p2p-messages = { workspace = true }
redux = { workspace = true }

crypto-bigint = { workspace = true }
mina-core = { workspace = true }
mina-macros = { workspace = true }
quick-protobuf = { workspace = true }
salsa-simple = { workspace = true }

prost = { workspace = true }

mina-fuzzer = { workspace = true, optional = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
crypto-bigint = { workspace = true, features = ["rand_core"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
clap = { workspace = true, features = ["derive", "env"] }
p2p-testing = { path = "testing" }
tracing-subscriber = { workspace = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redux = { workspace = true, features = ["serializable_callbacks"] }
tokio = { workspace = true, features = ["rt"] }
webrtc = { workspace = true, optional = true }
rustrtc = { workspace = true, optional = true }
datachannel = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
mio = { workspace = true }
libc = { workspace = true }
local-ip-address = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
gloo-timers = { workspace = true }
gloo-utils = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "MessageEvent",
  "RtcPeerConnection",
  "RtcConfiguration",
  "RtcIceTransportPolicy",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "RtcPeerConnectionState",
  "RtcIceGatheringState",
  "Window",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
] }
tokio = { workspace = true, features = ["macros"] }
getrandom = { workspace = true, features = ["js"] }

[features]
openapi = ["dep:utoipa"]
serializable_callbacks = []
# The WebRTC service (browser peers, the web node's relay). Natively it uses
# rustrtc (vendor/rustrtc) with ready events; the web node uses the browser's
# WebRTC with ready events.
p2p-webrtc = ["p2p-webrtc-rustrtc-lib", "p2p-webrtc-ready-events"]
# The fallback: the openmina webrtc-rs fork instead of rustrtc.
p2p-webrtc-rs = ["p2p-webrtc", "webrtc", "rcgen"]
p2p-webrtc-cpp = ["datachannel"]
# rustrtc, the default; kept as a name for build scripts.
p2p-webrtc-rustrtc = ["p2p-webrtc"]
p2p-webrtc-rustrtc-lib = ["dep:rustrtc"]
# Ready events on channel 0 instead of the driver's 1 s and 3 s sleeps, and
# Failed handled (service_impl/webrtc/ready.rs). Works with peers without it.
p2p-webrtc-ready-events = []
p2p-libp2p = ["fuzzing", "dep:reqwest"]
fuzzing = ["mina-fuzzer", "mina-core/fuzzing"]
