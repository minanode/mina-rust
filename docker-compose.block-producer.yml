# A block producer, on top of docker-compose.yml. Add this line to .env, and
# every docker compose command uses both files:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.block-producer.yml
#
# Before starting (https://minanode.org/docs/docker/#block-producer):
# - the encrypted key file at ./keys/producer-key, outside the state dir;
#   it is mounted read-only. Override with MINA_PRODUCER_KEY in .env.
# - its password in ./producer.env, readable by you only (chmod 600):
#     MINA_PRIVKEY_PASS='your password'
#   Never in this file, in .env or on a command line, and never committed.
# - for rewards to another account, in .env:
#     MINA_NODE_ARGS=--coinbase-receiver B62q...

services:
  mina:
    # --block-inject-delay-ms 3000 sends each block at least 3 s into its
    # slot, as the project's devnet producer does; the default is 1 s.
    command: >-
      node --network devnet --producer-key /keys/producer-key
      --block-inject-delay-ms 3000 --allow-worker-control
      ${MINA_NODE_ARGS:-}
    env_file:
      - producer.env
    volumes:
      - type: bind
        source: ${MINA_PRODUCER_KEY:-./keys/producer-key}
        target: /keys/producer-key
        read_only: true
        bind:
          create_host_path: false
