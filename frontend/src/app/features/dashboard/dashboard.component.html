<div
  class="header h-lg fx-row-vert-cent p-relative"
  [class.hide]="
    connectedProgress + ledgerProgress + blockSyncProgress === 100 && !restored
  "
>
  <div
    [style.width.%]="connectedProgress + ledgerProgress + blockSyncProgress"
    class="progress-bar p-absolute"
  >
    @if (connectedProgress + ledgerProgress + blockSyncProgress < 100) {
      <div class="highlight p-absolute"></div>
    }
    <div class="progress p-absolute w-100"></div>
  </div>
  <div class="primary">
    {{ updateAction }}
    <span class="tertiary">{{ updateDetail }}</span>
  </div>
</div>
<div class="body flex-column flex-grow overflow-auto">
  <mina-freshness />
  <mina-dashboard-roles />
  <div class="comps flex-row flex-column-lg">
    <mina-dashboard-network></mina-dashboard-network>
    <mina-dashboard-ledger></mina-dashboard-ledger>
    <mina-dashboard-blocks-sync
      class="flex-1 flex-column"
    ></mina-dashboard-blocks-sync>
  </div>
  <mina-verification-panel [compact]="true" />
</div>
