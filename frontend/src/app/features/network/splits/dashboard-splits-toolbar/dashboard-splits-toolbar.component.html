<mina-horizontal-menu
  [template]="template"
  [clz]="'pr-12 pl-12'"
></mina-horizontal-menu>

<ng-template #template>
  <div class="fx-row-vert-cent flex-between w-100">
    <div class="fx-row-vert-cent shrink-0">
      <div class="f-600 mr-10" data-topology-count>
        {{ loaded ? connected : 'Loading' }} connected peer{{
          connected | plural
        }}
      </div>
      <button
        class="h-sm btn-primary mr-10"
        [disabled]="fetching"
        (click)="refresh()"
      >
        <span class="fx-row-vert-cent">
          Refetch
          <span class="mina-icon icon-200 f-18 ml-5">sync</span>
        </span>
      </button>
      <span
        class="tertiary truncate"
        data-topology-source
        title="Read from the node's /state/peers: the peers it is connected to now. A node knows only its own connections, so links between other peers are not drawn."
      >
        {{ loaded ? 'Live from ' + nodeName : 'Loading selected node' }} · its
        own connections only
      </span>
    </div>
    <div class="fx-row-vert-cent shrink-0 ml-10">
      <span class="mina-icon icon-200 f-20 mr-5 success-primary webnode">
        radio_button_checked
      </span>
      <span class="success-secondary mr-10">&nbsp;This node</span>
      <span class="mina-icon icon-200 f-20 mr-5 success-primary">circle</span>
      <span class="success-secondary">Peer</span>
    </div>
  </div>
</ng-template>
