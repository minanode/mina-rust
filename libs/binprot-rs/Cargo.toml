# Vendored from https://github.com/openmina/binprot-rs at 400b52c. Changed:
# src/int.rs reads integers exactly as OCaml bin_prot v0.14.0 reads them.
[package]
name = "binprot"
version = "0.1.8"
authors = ["laurent"]
edition = "2018"

description = "Rust implementation of the bin_prot protocol."
repository = "https://github.com/LaurentMazare/binprot-rs"
keywords = ["bin_prot", "protocol", "network"]
categories = ["network-programming"]
license = "MIT/Apache-2.0"
readme = "README.md"

[dependencies]
async-trait = { version = "0.1.50", optional = true }
binprot_derive = { version = "0.1.7", path = "binprot_derive" }
byteorder = "1.4.3"
md5 = "0.7.0"
tokio = { version = "1.8", optional = true, features = [
  "io-util",
  "macros",
  "rt",
] }

[dev-dependencies]
anyhow = "1"

[features]
async = ["binprot_derive/async", "async-trait", "tokio"]
