include = ["**/*.toml"]
exclude = [
  "**/node_modules/**",
  "**/target/**",
  "**/.git/**",
  "vendor/rustrtc/**",
  "vendor/wasm_thread/**",
]

[formatting]
reorder_keys = false

[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies", "workspace.dependencies"]
formatting = { reorder_keys = true }
