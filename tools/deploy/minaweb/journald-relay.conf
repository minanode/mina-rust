# The journal is a relay host's only system log. Install as
# /etc/systemd/journald.conf.d/zz-mina-relay.conf (MINAWEB.md, "Logs"): the
# name sorts last, after rsyslog's /usr/lib/systemd/journald.conf.d/syslog.conf
# (ForwardToSyslog=yes), so these values win.
# It holds client addresses: coturn logs each TURN session with the client's
# address, the node logs its peers' addresses, sshd logs the owner's. They are
# kept 7 days, in at most 1 GiB. Nothing is copied to rsyslog's text files.
[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=1G
ForwardToSyslog=no
