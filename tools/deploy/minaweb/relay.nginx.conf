# Include inside nginx's http block. Obtain the certificate before enabling.
# <RELAY_DOMAIN> is this relay's name, such as relay1.minaweb.org (MINAWEB.md
# substitutes it per host).
#
# IPv4 only: there is no AAAA record and no [::] listener. These zones key on
# the whole client address; before adding IPv6, key them on the /64, or one
# IPv6 client gets a fresh budget for every address in its /64.
limit_req_zone $binary_remote_addr zone=mina_signal:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=mina_ice:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=mina_connections:10m;
server {
    listen 443 ssl;
    server_name <RELAY_DOMAIN>;
    ssl_certificate /etc/letsencrypt/live/<RELAY_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<RELAY_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 with forward-secret AEAD suites only (Mozilla "intermediate"
    # without DHE); TLS 1.3 suites are all AEAD.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    # On every response, errors included. HSTS covers this host name only:
    # no includeSubDomains, no preload. Port 80 serves only ACME and a
    # redirect.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # Offers contain visitor addresses. Neither access nor error logs record URIs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 128k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_conn mina_connections 8;
    limit_req_status 429;
    location ~ ^/mina/webrtc/signal(?:/[^/]+)?$ {
        limit_req zone=mina_signal burst=10 nodelay;
        # The visitor's address, replacing any it sent: a sharing relay
        # counts introductions per address (--webrtc-sharing-relay).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
    }
    location = /ice-servers.json {
        limit_req zone=mina_ice burst=10 nodelay;
        # The issuer gives each address one username, so coturn's user-quota
        # is per address (turn-credentials.py).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3002;
        proxy_read_timeout 5s;
    }
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 5s;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name <RELAY_DOMAIN>;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://<RELAY_DOMAIN>$request_uri; }
}
