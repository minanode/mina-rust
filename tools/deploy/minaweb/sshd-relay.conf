# SSH on a relay host: root with the owner's key, nothing else. Install as
# /etc/ssh/sshd_config.d/10-mina-relay.conf; sshd takes the first value it
# reads, and this file sorts before cloud-init's 50-cloud-init.conf.
# The firewall admits port 22 from the owner's address only.
PermitRootLogin prohibit-password
AllowUsers root
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
# Local forwarding only, for the operator API tunnel (ssh -L 13001:...).
AllowTcpForwarding local
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
# No SHA-1 MACs.
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com
