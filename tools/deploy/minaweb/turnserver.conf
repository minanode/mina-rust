# coturn for web nodes on networks that drop the UDP a WebRTC connection
# needs: the browser reaches TURN on 3478 (UDP or TCP) and TURN reaches the
# relay. Install as /etc/turnserver.conf; see README.md here, "TURN".
#
# The issuer returns expiring public credentials; the shared signing secret
# stays only on this host. The peer allowlist prevents arbitrary destinations.
# Replace placeholders before starting. See docs/release/MINAWEB.md.

# TURN and STUN on 3478, UDP and TCP. No TLS listener (turns:): see README.md
# for turns on 443.
listening-port=3478
no-tls
no-dtls
# The host's public IPv4 address. On a cloud host whose interface has a
# private address behind a 1:1 NAT, use external-ip=<PUBLIC>/<PRIVATE> and
# the private address for listening-ip and relay-ip.
listening-ip=<VPS_PUBLIC_IPV4>
relay-ip=<VPS_PUBLIC_IPV4>
# The relay addresses' ports. They carry traffic between TURN and the relay
# node on this host only (over the loopback interface), so the firewall
# keeps them closed. 848 ports: one per concurrent allocation.
min-port=49152
max-port=49999

realm=minaweb.org
server-name=relay.minaweb.org
fingerprint

# REST credentials minted by the loopback credential service. This secret is
# private and is never shipped to the page. Install the same value in the
# service's turn_secret credential; see docs/release/MINAWEB.md.
use-auth-secret
static-auth-secret=<TURN_AUTH_SECRET>
user-quota=4
max-allocate-lifetime=600

# IP-only ACL: allowed-peer-ip wins over denied-peer-ip. This cannot filter
# destination ports. The mandatory mina-turn-egress unit restricts coturn UDP
# allocation output to the relay WebRTC range, including same-host traffic.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=<VPS_PUBLIC_IPV4>
no-multicast-peers
# UDP allocations only, which is what WebRTC asks for. A TCP allocation to
# this host's own address would reach ports the firewall closes, the node's
# HTTP API among them.
no-tcp-relay

# Limits: total-quota caps concurrent allocations (each visitor on TURN takes
# one per peer connection). No max-bps or bps-capacity: coturn enforces them
# by dropping packets, and in W1's test a 2 MB/s session cap made the WebRTC
# connection's data channels close every 12 to 70 s during a bootstrap, which
# then took 381 s instead of 46 s. The relay's own sending is the bound.
total-quota=200
stale-nonce=600

no-cli
no-rfc5780
no-software-attribute
log-file=stdout
