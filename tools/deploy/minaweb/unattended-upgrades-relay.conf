// Security updates on a relay host. Install as
// /etc/apt/apt.conf.d/52mina-relay (MINAWEB.md, "Updates").
// Ubuntu's apt-daily-upgrade timer installs them each morning (06:00 to
// 07:00 UTC); a kernel or libc update then needs a reboot, at the time below.
// Give each relay its own hour, so that they never reboot together.
// coturn is not a package here (build-coturn.sh): update it by hand.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
